# CI: installs dependencies, builds back/front end , lints code 
name: ci

# run this workflow when code is pushed to the main branch
on:
  push:
    branches: [main]

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Check out code # downloads your repository code into the GitHub runner
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4 # install Node.js
        with:
          node-version: 22 # match the runtime that was being built against
          cache: npm # cache: npm speeds up dependency installation in CI
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json # cache both root and frontend dependencies

      - name: Install root dependencies # installs root dependencies from package-lock.json
        run: npm ci # used ci instead of install because this makes ci more predictable and reproducible

      - name: Build backend/root project # compiles backend TypeScript
        run: npm run build

      - name: Install frontend dependencies # installs frontend dependencies from frontend/package-lock.json
        run: npm --prefix frontend ci

      - name: Build frontend project # builds the frontend so CI verifies both backend and dashboard
        run: npm --prefix frontend run build

  lint: # checks code style and quality using linter.
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4 # downloads repository code into the GitHub runner

      - name: Set up Node
        uses: actions/setup-node@v4 # installs Node.js
        with:
          node-version: 22
          cache: npm # cache: npm speeds up dependency installation in CI
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json # cache both root and frontend dependencies

      - name: Install root dependencies
        run: npm ci # installs exact dependencies from package-lock.json

      - name: Lint backend/root
        run: npm run lint -- --max-warnings=0 --ignore-pattern frontend # runs root lint only and skips frontend

      - name: Install frontend dependencies
        run: npm --prefix frontend ci # installs exact frontend dependencies from frontend/package-lock.json

      - name: Lint frontend
        run: npm run lint:frontend # runs frontend lint with frontend dependencies installed

